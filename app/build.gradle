plugins { id 'com.android.application' }
def ksFile = System.getenv("KEYSTORE_FILE"); def ksPass = System.getenv("KEYSTORE_PASSWORD"); def kAlias = System.getenv("KEY_ALIAS"); def kPass = System.getenv("KEY_PASSWORD")
def hasSigning = ksFile != null && ksPass != null && kAlias != null && kPass != null
android {
    namespace 'com.qognix.docuflow'
    compileSdk 36
    defaultConfig { applicationId "com.qognix.docuflow"; minSdk 24; targetSdk 36; versionCode 2; versionName "2.0" }
    signingConfigs { if (hasSigning) { release { storeFile file(ksFile); storePassword ksPass; keyAlias kAlias; keyPassword kPass } } }
    buildTypes { release { minifyEnabled false; shrinkResources false; if (hasSigning) { signingConfig signingConfigs.release }; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
