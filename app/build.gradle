plugins {
    id 'com.android.application'
}

// Optional release signing via environment variables (GitHub Actions secrets).
// Without them the release build stays unsigned, which is expected for now.
// The keystore itself must never be uploaded to GitHub as a normal file.
def ksFile = System.getenv("KEYSTORE_FILE")
def ksPass = System.getenv("KEYSTORE_PASSWORD")
def kAlias = System.getenv("KEY_ALIAS")
def kPass = System.getenv("KEY_PASSWORD")
def hasSigning = ksFile != null && ksPass != null && kAlias != null && kPass != null

android {
    namespace 'com.qognix.docuflow'
    compileSdk 36

    defaultConfig {
        applicationId "com.qognix.docuflow"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "3.1"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // Start.io (StartApp) SDK — full-screen interstitial + rewarded video ads.
    implementation 'com.startapp:inapp-sdk:5.+'
}
