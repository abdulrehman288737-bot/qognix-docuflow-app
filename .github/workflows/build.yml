name: Build Qognix DocuFlow APK

# Free build on GitHub's servers. Push this project to a GitHub repository,
# then run this workflow from the Actions tab (or it runs automatically on push).
#
# SIGNED release (optional): if you add these repository Secrets, the release
# APK is signed with your own keystore (needed for store updates):
#   KEYSTORE_BASE64    - base64 of qognix-docuflow-release.jks
#   KEYSTORE_PASSWORD  - the keystore password (see KEYSTORE-KEEP-SAFE.txt)
#   KEY_ALIAS          - qognixdocuflow
#   KEY_PASSWORD       - same as KEYSTORE_PASSWORD
# Without the secrets you still get a working debug APK for testing and an
# unsigned release APK.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: The android-actions/setup-android step was removed (2026-11-17)
      # because it tried to install the obsolete 'tools' package. The runner
      # image does include the Android SDK, but sdkmanager is NOT on PATH,
      # so it is located under $ANDROID_HOME and called by its full path.
      - name: Install SDK Platform 36 and Build Tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore (only if secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qognix-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/qognix-release.jks" >> "$GITHUB_ENV"
            echo "Release signing: ON"
          else
            echo "Release signing: OFF (no keystore secret) - release APK will be unsigned"
          fi

      - name: Build debug APK (installable for testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (signed if keystore secret was provided)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: QognixDocuFlow-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
